<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DecideX · 炉石顾问 优秀操作回放</title>
<style>
  :root{
    --bg:#0d1315; --panel:#131c1e; --panel-raised:#1a2628; --line:#2c3c3d;
    --gold:#e5bd68; --gold-soft:#f0d99f; --txt:#e8ece5; --dim:#9daaa5;
    --green:#61c49b; --red:#e47f76; --blue:#72b6c4; --purple:#b7a0dc;
    --focus:#f4d78b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0d1315;color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  a{color:var(--blue)}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
         padding:10px max(18px,calc((100vw - 1560px)/2));border-bottom:1px solid var(--line);
         background:rgba(13,19,21,.96);backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{font-size:16px;font-weight:750;white-space:nowrap}
  .logo b{color:var(--gold)}
  .brand-badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.on{color:#8bd8b8;border-color:rgba(97,196,155,.3);background:rgba(97,196,155,.08)}
  .header-controls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  select,button{min-height:34px;background:var(--panel-raised);color:var(--txt);border:1px solid var(--line);
                border-radius:6px;padding:6px 10px;font-size:13px}
  select{max-width:min(260px,45vw)}
  button{cursor:pointer;transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
  button:hover{border-color:#667a72;background:#223033}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--gold);color:#211b10;font-weight:750;border-color:var(--gold)}
  button.primary:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
  button:disabled{opacity:.55;cursor:wait;transform:none}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .wrap{display:grid;grid-template-columns:minmax(220px,260px) minmax(400px,1fr) minmax(340px,390px);
        grid-template-areas:"timeline board advisor";gap:12px;padding:14px clamp(14px,2vw,28px) 10px;
        max-width:1640px;margin:0 auto;align-items:start}
  .timeline-region{grid-area:timeline;min-width:0}
  .board-region{grid-area:board;min-width:0}
  .advisor-region{grid-area:advisor;min-width:0}
  .card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .card h2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:11px 13px;
           font-size:12px;font-weight:700;letter-spacing:.04em;color:#c4cec7;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}
  .card .body{min-width:0;padding:12px 13px}
  .section-meta{color:var(--dim);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none}
  #stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.055)}
  #stats>div{min-width:0;padding:2px 5px}
  #stats .k{font-size:10px;color:var(--dim)}
  #stats .v{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;color:#e4d5ad}
  .turns{max-height:calc(100vh - 195px);min-height:88px;overflow:auto;overscroll-behavior:contain;scrollbar-color:#475854 transparent;scrollbar-width:thin}
  .turn{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;border:0;border-bottom:1px solid rgba(255,255,255,.055);border-radius:0;
        background:transparent;text-align:left;font-size:12px}
  .turn:hover{background:rgba(255,255,255,.04)}
  .turn.sel{background:rgba(229,189,104,.09);box-shadow:inset 3px 0 0 var(--gold)}
  .turn .t{flex:0 0 auto;min-width:29px;color:var(--gold);font-weight:750;font-variant-numeric:tabular-nums}
  .turn .m{min-width:0;color:var(--dim);font-size:11px}
  .turn-result{margin-left:auto;flex:0 0 auto;color:var(--dim);font-size:10px;white-space:nowrap}
  .turn-result.ok{color:#8bd8b8}.turn-result.no{color:#f19a91}
  .turn-result.na{color:var(--dim)}
  .board-region .body{padding:14px}
  .side{min-width:0;margin-bottom:13px}
  .side .label{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
  .heroRow{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 11px;border-radius:6px;
           border:1px solid var(--line);background:#182325}
  .heroRow.opp{background:#251d1d;border-color:#493131}
  .heroRow>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
  .portrait{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-weight:800;
            background:#0b1112;border:1px solid #53605b;color:var(--gold);font-size:15px}
  .heroRow.opp .portrait{color:#f0a19a}
  .hp{font-size:19px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
  .atk{font-size:11px;color:var(--gold)}
  .minions{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;min-height:8px}
  .minion{width:74px;min-height:58px;border-radius:6px;border:1px solid var(--line);background:#111a1c;padding:6px;
          text-align:center;position:relative}
  .minion .nm{font-size:10px;line-height:1.25;min-height:25px;overflow-wrap:anywhere;color:#d0d9d2}
  .minion .stats{display:flex;justify-content:space-between;margin-top:3px;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
  .minion .a{color:var(--gold)}.minion .h{color:var(--red)}
  .minion.taunt{border-color:#8b713d;box-shadow:inset 0 0 0 1px rgba(229,189,104,.16)}
  .minion.sick{opacity:.58}
  .hand{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
  .hcard{position:relative;width:78px;min-height:78px;flex:0 0 78px;border-radius:6px;border:1px solid #42616a;background:#152327;padding:8px 6px 6px;text-align:center}
  .hcard .nm{min-height:29px;padding-top:4px;font-size:10px;line-height:1.25;overflow-wrap:anywhere;color:#cae2e2}
  .hcard .cost{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#091416;font-weight:800;font-size:11px;display:grid;place-items:center}
  .hcard .ty{font-size:9px;color:var(--dim);margin-top:4px}
  .mana{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:3px 0 13px}
  .crystal{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:#182b30;border:1px solid #49636a}
  .crystal.full{background:#6eb9c3;box-shadow:0 0 7px rgba(110,185,195,.42)}
  .rec{min-width:0;font-size:14px}
  .rec .big{font-size:15px;font-weight:750;color:#f0dfb0;overflow-wrap:anywhere}
  .pill{display:inline-block;margin:6px 4px 0 0;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim);font-size:10px;white-space:normal;overflow-wrap:anywhere}
  .pill.fb{color:var(--gold);border-color:#66552f;background:rgba(229,189,104,.08)}
  .pill.model{color:#c5b4e6;border-color:#53466c;background:rgba(183,160,220,.08)}
  .conf{margin:11px 0}
  .bar{height:7px;border-radius:4px;background:#0b1112;border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#3d9e77,var(--green))}
  .cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:11px 0}
  .cmp .box{min-width:0;border:1px solid var(--line);border-radius:5px;padding:8px;background:#111a1c}
  .cmp .box .h{font-size:10px;color:var(--dim);margin-bottom:4px}
  .cmp .box .v{font-size:11px;overflow-wrap:anywhere}
  .verdict{margin-top:8px;font-weight:700;font-size:12px}
  .verdict.ok{color:#8bd8b8}.verdict.no{color:#f19a91}
  .env{max-height:230px;overflow:auto;border-top:1px solid var(--line);margin-top:9px;overscroll-behavior:contain}
  .opt{display:flex;gap:8px;padding:6px 5px;border-bottom:1px solid rgba(255,255,255,.055);font-size:11px;align-items:baseline;min-width:0}
  .opt .tag{flex:0 0 62px;font-size:10px;color:var(--dim)}
  .opt.pick{background:rgba(97,196,155,.08);box-shadow:inset 2px 0 0 var(--green)}
  .opt .id{min-width:0;color:#b6c6bf;overflow-wrap:anywhere}
  .muted{color:var(--dim)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #ffffff33;border-top-color:var(--gold);
        border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{max-width:1640px;margin:0 auto;font-size:11px;color:var(--dim);padding:5px clamp(14px,2vw,28px) 18px}
  .note code{background:#0b1112;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
  @media(max-width:1239px) and (min-width:760px){
    .wrap{grid-template-columns:minmax(210px,.72fr) minmax(0,1.7fr);grid-template-areas:"timeline board" "timeline advisor";gap:10px;padding:12px 14px 8px}
    .turns{max-height:calc(100vh - 180px)}
  }
  @media(max-width:759px){
    header{position:relative;padding:10px 12px;gap:8px}
    .brand{width:100%;justify-content:space-between}
    .header-controls{width:100%;margin-left:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
    .field{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px;font-size:10px}
    .field select{width:100%;max-width:none;min-width:0}
    #runAll{grid-column:1/-1}
    .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"timeline" "board" "advisor";gap:10px;padding:10px 10px 6px}
    .card h2{padding:10px 11px}
    .card .body{padding:10px 11px}
    #stats{padding:8px 9px}
    #stats .v{font-size:17px}
    .turns{max-height:210px;min-height:72px}
    .turn{padding:8px 10px}
    .board-region .body{padding:11px}
    .heroRow{padding:9px;gap:8px}
    .minion{width:68px}
    .hcard{width:72px;flex-basis:72px;min-height:74px}
    .cmp{grid-template-columns:repeat(2,minmax(0,1fr))}
    .note{padding:5px 12px 16px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
<!-- 可视化组件（概率条 / 置信三档 / token 仪表 / lint 面板）与炉石看板共用同一份，
     由 app.py 从 tools/web_shared/ 提供，避免两站各写一份后漂移。 -->
<link rel="stylesheet" href="/viz.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">DecideX · <b>炉石回放</b></div>
    <div class="brand-badges">
      <span id="provBadge" class="badge">provider: —</span>
      <span id="hsBadge" class="badge">hslog: —</span>
    </div>
  </div>
  <div class="header-controls">
    <label class="field">对局<select id="gameSel" aria-label="选择对局"></select></label>
    <label class="field">引擎<select id="provSel" aria-label="选择推荐引擎">
      <option value="heuristic">启发式（离线·秒出）</option>
      <option value="model">真实模型（Jev 网关）</option>
    </select></label>
    <button class="primary" id="runAll" type="button">跑整局</button>
  </div>
</header>

<div class="wrap">
  <!-- LEFT: decision points -->
  <section class="card timeline-region" aria-labelledby="timelineTitle">
    <h2 id="timelineTitle">决策时间线 <span id="selectedTurn" class="section-meta">等待回放</span></h2>
    <div class="body stat" id="stats" aria-label="整局分析摘要">
      <div><div class="k">决策点</div><div class="v" id="sCount">–</div></div>
      <div><div class="k">一致率</div><div class="v" id="sAgree">–</div></div>
      <div><div class="k">保底</div><div class="v" id="sFallback">–</div></div>
    </div>
    <div class="turns" id="turns" aria-label="选择决策回合" aria-live="polite"><div class="muted" style="padding:14px">加载中…</div></div>
  </section>

  <!-- CENTER: board -->
  <section class="card board-region" aria-labelledby="boardTitle">
    <h2 id="boardTitle">棋盘重建 <span class="section-meta">Power.log</span></h2>
    <div class="body" id="board" aria-live="polite"><div class="muted">选择一个决策点查看该回合盘面。</div></div>
  </section>

  <!-- RIGHT: recommendation -->
  <section class="card advisor-region" aria-labelledby="advisorTitle">
    <h2 id="advisorTitle">顾问分析 <span class="section-meta">只读建议</span></h2>
    <div class="body" id="recBody" aria-live="polite"><div class="muted">选择决策点后查看推荐。</div></div>
  </section>
</div>
<div class="note" id="note" role="status" aria-live="polite"></div>

<script src="/viz.js"></script>
<script>
const $ = s => document.querySelector(s);
let STATE = { games:[], log:null, decisions:[], sel:-1, provider:'heuristic', requestId:0 };

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ throw new Error(await r.text() || r.status); }
  return r.json();
}

async function boot(){
  try{
    const h = await api('/api/health');
    $('#hsBadge').textContent = 'hslog: ' + (h.hslog ? '可用' : '缺失');
    $('#hsBadge').className = 'badge ' + (h.hslog?'on':'');
    STATE.games = h.games || [];
    const sel = $('#gameSel');
    sel.innerHTML = STATE.games.map(g=>`<option value="${esc(g.name)}">${esc(g.name)} (${g.size_kb}KB)</option>`).join('');
    if(!STATE.games.length){
      $('#turns').innerHTML = '<div class="muted" style="padding:14px">data/replays 下没有 .log 回放</div>';
      $('#selectedTurn').textContent = '无可用回放';
      $('#board').innerHTML = '<div class="muted">添加 Power.log 回放后即可查看重建棋盘。</div>';
      $('#recBody').innerHTML = '<div class="muted">暂无回放，顾问分析不可用。</div>';
      return;
    }
    sel.value = STATE.games[0].name;
    await loadGame(STATE.games[0].name);
  }catch(e){
    $('#note').textContent = '启动失败: ' + e.message;
    $('#turns').innerHTML = '<div class="muted" style="padding:14px">回放列表加载失败，请检查服务后重新载入页面。</div>';
    $('#selectedTurn').textContent = '加载失败';
  }
}

async function loadGame(name){
  STATE.log = name; STATE.sel = -1; STATE.decisions = [];
  const requestId = ++STATE.requestId;
  $('#sCount').textContent = '–'; $('#sAgree').textContent = '–'; $('#sFallback').textContent = '–';
  $('#selectedTurn').textContent = '解析中';
  $('#note').textContent = '';
  $('#turns').innerHTML = '<div class="muted" style="padding:14px"><span class="spin"></span> 解析回放…</div>';
  $('#board').innerHTML = '<div class="muted">…</div>';
  $('#recBody').innerHTML = '<div class="muted">…</div>';
  try{
    const g = await api('/api/game?log='+encodeURIComponent(name));
    if(requestId !== STATE.requestId || STATE.log !== name) return;
    STATE.decisions = g.decisions || [];
    renderTurns();
    if(STATE.decisions.length){ selectTurn(0); }
    else {
      $('#selectedTurn').textContent = '无决策点';
      $('#board').innerHTML = '<div class="muted">该回放没有可重建的决策盘面。</div>';
      $('#recBody').innerHTML = '<div class="muted">该回放没有决策点可供分析。</div>';
    }
  }catch(e){
    if(requestId !== STATE.requestId || STATE.log !== name) return;
    $('#turns').innerHTML = '<div class="muted" style="padding:14px">解析失败: '+esc(e.message)+'</div>';
    $('#selectedTurn').textContent = '解析失败';
    $('#board').innerHTML = '<div class="muted">无法重建棋盘，请重试或选择其他回放。</div>';
    $('#recBody').innerHTML = '<div class="muted">回放加载失败，暂时无法生成建议。</div>';
  }
}

function renderTurns(){
  const el = $('#turns');
  if(!STATE.decisions.length){ el.innerHTML='<div class="muted" style="padding:14px">该回放没有解析出决策点</div>'; return; }
  el.innerHTML = STATE.decisions.map((d,i)=>{
    const cls = d.result ? (d.result.agreed?'ok':'no') : 'na';
    const result = d.result ? (d.result.agreed?'一致':'不同') : '待分析';
    return `<button class="turn ${i===STATE.sel?'sel':''}" type="button" data-i="${i}" aria-pressed="${i===STATE.sel}" aria-current="${i===STATE.sel?'true':'false'}">
      <span class="t">T${d.turn}</span>
      <span class="m">${d.mana}/${d.max_mana} · ${d.option_count} 选项</span>
      <span class="turn-result ${cls}">${result}</span></button>`;
  }).join('');
  el.querySelectorAll('.turn').forEach(n=>n.onclick=()=>selectTurn(+n.dataset.i));
}

function renderBoard(d){
  const b = d.board;
  const minion = m => `<div class="minion ${m.taunt?'taunt':''} ${m.can_attack?'':'sick'}">
      <div class="nm">${esc(m.name)}</div>
      <div class="stats"><span class="a">${m.attack}</span><span class="h">${m.health}</span></div></div>`;
  const hero = (h,opp) => `<div class="heroRow ${opp?'opp':''}">
      <div class="portrait">${esc((h.name||'?')[0])}</div>
      <div><div style="font-weight:700">${esc(h.name)}</div>
      <div class="muted" style="font-size:12px">${opp?'对手':'我方'} · 法力/武器 ${h.attack||0}</div></div>
      <div style="margin-left:auto;text-align:right">
        <div class="hp">${h.health}${h.armor?'+'+h.armor:''}</div><div class="atk">HP</div></div></div>`;
  const mana = Array.from({length:b.max_mana||0},(_,i)=>`<span class="crystal ${i<b.mana?'full':''}"></span>`).join('');
  const hand = b.hand.map(c=>`<div class="hcard"><div class="cost">${c.cost}</div>
      <div class="nm">${esc(c.name)}</div><div class="ty">${esc(c.card_type)}</div></div>`).join('') || '<span class="muted">空手牌</span>';
  return `
    <div class="side">${hero(b.opp_hero,true)}<div class="minions">${b.opp_minions.map(minion).join('')||'<span class="muted">无随从</span>'}</div></div>
    <div class="side">${hero(b.my_hero,false)}<div class="minions">${b.my_minions.map(minion).join('')||'<span class="muted">无随从</span>'}</div></div>
    <div class="mana">${mana}<span class="muted" style="margin-left:8px">${b.mana}/${b.max_mana} 法力 · 牌库 ${b.deck_count}</span></div>
    <div class="side"><div class="label">手牌</div><div class="hand">${hand}</div></div>`;
}

function renderRec(d, rec){
  const el = $('#recBody');
  if(!rec){ el.innerHTML = '<div class="muted">计算中…</div>'; return; }
  const conf = Math.round((rec.confidence||0)*100);
  const prov = rec.provider==='model' ? '<span class="pill model">真实模型</span>' : '<span class="pill">启发式</span>';
  const fb = rec.is_fallback ? `<span class="pill fb">保底: ${esc(rec.fallback_reason||'')}</span>` : '';
  const human = d.human || {candidate:'-',action_type:'-'};
  const vcls = rec.agreed ? 'ok':'no';
  const vtxt = rec.agreed ? '✓ 与人类操作一致' : '✗ 与人类操作不同';
  const opts = (rec.legal_actions||[]).map(o=>{
    const pick = o.id===rec.candidate_id ? 'pick':'';
    return `<div class="opt ${pick}"><span class="tag">${esc(o.action_type)}</span><span class="id">${esc(o.id)}</span></div>`;
  }).join('') || '<div class="muted" style="padding:8px">—</div>';
  el.innerHTML = `
    <div class="rec">
      <div class="big">${esc(rec.description)}</div>
      <div style="margin-top:6px">${prov}${fb}<span class="pill">${esc(rec.action_type)}</span><span class="pill">${rec.latency_ms!=null?rec.latency_ms+'ms':''}</span></div>
      <div class="conf"><div class="muted" style="font-size:12px;margin-bottom:4px">置信度 ${conf}%</div>
        <div class="bar"><i style="width:${conf}%"></i></div></div>
      <div class="cmp">
        <div class="box"><div class="h">顾问推荐</div><div class="v">${esc(rec.candidate_id)}</div></div>
        <div class="box"><div class="h">人类实操</div><div class="v">${esc(human.candidate)}</div></div>
      </div>
      <div class="verdict ${vcls}">${vtxt}</div>
      <div class="muted" style="font-size:12px;margin-top:10px">合法动作包络（游戏引擎权威下发，${(rec.legal_actions||[]).length} 项）</div>
      <div class="env">${opts}</div>
      <div id="vizHost"></div>
    </div>`;
  // 概率分布 / 置信三档 / token 预算 / 发前体检全部由服务端展示模型驱动
  // (src/decidex/viz.py)；这里只挂载，阈值不在两端各写一份。
  if (window.DecidexViz) DecidexViz.render($('#vizHost'), rec.viz);
}

async function selectTurn(i){
  if(i<0 || i>=STATE.decisions.length) return;
  const requestId = ++STATE.requestId;
  STATE.sel = i; renderTurns();
  const d = STATE.decisions[i];
  $('#selectedTurn').textContent = `第 ${d.turn} 回合 · ${i+1}/${STATE.decisions.length}`;
  $('#board').innerHTML = renderBoard(d);
  renderRec(d, null);
  try{
    const rec = await api('/api/recommend', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({log:STATE.log, index:i, provider:STATE.provider})});
    if(requestId !== STATE.requestId || STATE.sel !== i) return;
    STATE.decisions[i].result = rec;
    renderRec(d, rec); renderTurns();
  }catch(e){
    if(requestId !== STATE.requestId || STATE.sel !== i) return;
    $('#recBody').innerHTML = '<div class="muted">推荐失败: '+esc(e.message)+'。切换引擎或重新选择此回合可重试。</div>';
  }
}

async function runAll(){
  if(!STATE.log) return;
  const log = STATE.log, provider = STATE.provider;
  const btn = $('#runAll'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 跑整局…';
  try{
    const r = await api('/api/replay', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({log, provider})});
    if(STATE.log === log && STATE.provider === provider){
      const reports = r.reports || [];
      if(!reports.length) throw new Error('服务未返回回合分析结果');
      reports.forEach((rep,i)=>{ if(STATE.decisions[i]) STATE.decisions[i].result = rep; });
      const n = reports.length;
      const agree = reports.filter(x=>x.agreed).length;
      const fb = reports.filter(x=>x.is_fallback).length;
      $('#sCount').textContent = n; $('#sAgree').textContent = n? Math.round(100*agree/n)+'%':'–';
      $('#sFallback').textContent = fb;
      renderTurns();
      if(STATE.sel>=0) renderRec(STATE.decisions[STATE.sel], STATE.decisions[STATE.sel].result);
    }
  }catch(e){
    if(STATE.log === log && STATE.provider === provider)
      $('#note').textContent = '整局分析失败: '+e.message+'。可以重试或切换推荐引擎。';
  }
  btn.disabled = false; btn.textContent = '跑整局';
}

$('#gameSel').onchange = e => loadGame(e.target.value);
$('#provSel').onchange = e => { STATE.provider = e.target.value;
  $('#provBadge').textContent = 'provider: ' + STATE.provider;
  $('#provBadge').className = 'badge ' + (STATE.provider==='model'?'':'on');
  if(STATE.sel>=0) selectTurn(STATE.sel);
  $('#note').textContent = ''; };
$('#runAll').onclick = runAll;
$('#provBadge').textContent = 'provider: heuristic';
$('#provBadge').className = 'badge on';
$('#note').innerHTML = '只读顾问：仅枚举合法动作并给出推荐，绝不驱动游戏客户端。数据源：本机 <code>data/replays/*.log</code> 真实 Power.log。';
boot();
</script>
</body>
</html>
