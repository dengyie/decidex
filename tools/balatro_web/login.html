<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>登录 · DecideX 小丑牌顾问</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#0d1412; --panel:#141d19; --line:#34433b;
    --text:#e9eee8; --dim:#a3b0a7; --gold:#e7bd66; --bad:#f19a91;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100svh; padding:24px 16px;
         display:grid; place-items:center; color:var(--text);
         background:var(--bg); font:14px/1.5 "Segoe UI",system-ui,sans-serif; }
  .login-shell { width:min(420px,100%); }
  .brand { display:flex; align-items:center; gap:12px; margin:0 0 20px 2px; }
  .brand-mark { width:42px; height:42px; display:grid; place-items:center; flex:none;
                border:1px solid #55634d; border-radius:7px; background:#1b2922; color:var(--gold); font-size:20px; }
  .brand-kicker { color:var(--dim); font-size:9px; line-height:1.2; }
  h1 { margin:2px 0 0; color:var(--text); font-size:17px; line-height:1.3; }
  h1 span { color:var(--gold); }
  .login-panel { padding:23px 24px 20px; border:1px solid var(--line); border-radius:7px; background:var(--panel); }
  .back-home { margin:14px 0 0; text-align:center; }
  .back-home a { color:var(--dim); font-size:12px; text-decoration:none; }
  .back-home a:hover { color:var(--text); text-decoration:underline; }
  h2 { margin:0; font-size:15px; line-height:1.4; }
  .sub { margin:5px 0 20px; color:var(--dim); font-size:12px; }
  .field { margin:0 0 15px; }
  label { display:block; margin:0 0 6px; color:#c5d0c7; font-size:12px; font-weight:600; }
  input { width:100%; min-height:42px; padding:9px 11px; border:1px solid #3b4a41; border-radius:5px;
          background:#0f1713; color:var(--text); font:inherit; }
  input::placeholder { color:#79867d; }
  input:focus-visible { border-color:var(--gold); outline:2px solid var(--gold); outline-offset:2px; }
  button { width:100%; min-height:42px; margin-top:2px; padding:9px 12px; border:1px solid var(--gold);
           border-radius:5px; background:var(--gold); color:#21190c; font:inherit; font-weight:750; cursor:pointer; }
  button:hover { background:#f0cf82; border-color:#f0cf82; }
  button:focus-visible { outline:2px solid #f4d78b; outline-offset:3px; }
  button:disabled { opacity:.62; cursor:wait; }
  .err { min-height:20px; margin-top:12px; color:var(--bad); font-size:12px; overflow-wrap:anywhere; }
  .err:empty { visibility:hidden; }
  .err:not(:empty) { padding:8px 10px; border-left:2px solid var(--bad); background:#281c1a; }
  .login-note { margin:12px 2px 0; color:#85938a; font-size:11px; }
  @media(max-width:420px) {
    body { padding:20px 14px; }
    .login-panel { padding:20px 17px 17px; }
  }
  @media(prefers-reduced-motion:reduce) {
    *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; }
  }
</style>
</head>
<body>
<main class="login-shell">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🃏</div>
    <div>
      <div class="brand-kicker">BALATRO LIVE CONSOLE</div>
      <h1>DecideX <span>小丑牌顾问</span></h1>
    </div>
  </div>
  <section class="login-panel" aria-labelledby="loginTitle">
    <h2 id="loginTitle">登录控制台</h2>
    <p class="sub">登录后可查看实时对局并操作游戏。</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="user">账号</label>
        <input id="user" type="text" placeholder="请输入账号" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="pw">密码</label>
        <input id="pw" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button id="go" type="submit">登录</button>
      <div class="err" id="err" role="status" aria-live="polite" aria-atomic="true"></div>
    </form>
  </section>
  <p class="login-note">通过身份验证后，控制台才会启用游戏输入。</p>
  <p class="back-home"><a href="/">← 返回工具目录</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
// Server-validated same-origin path injected by app.py (see _safe_next_path);
// never read `next` from the query string directly — that would be an open redirect.
const next = __NEXT_PATH__;

$('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('err').textContent = '';
  const user = $('user').value.trim();
  const pw = $('pw').value;
  if (!user || !pw) return;
  $('go').disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Requested-With': 'decidex-web'},
      body: JSON.stringify({user, password: pw})
    });
    if (r.ok) { location.href = next; return; }
    $('err').textContent = r.status === 403 ? '请求被拒绝(CSRF 校验失败)' : '账号或密码不正确';
  } catch (e) {
    $('err').textContent = '网络错误: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
