<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DecideX · 小丑牌顾问</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3c;
          --text:#d8dde6; --dim:#8b93a3; --accent:#f2b134; --good:#5fd08a; --bad:#e06c6c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 "Segoe UI",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel);
           border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; color:var(--accent); white-space:nowrap; }
  select,button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
                  border-radius:6px; padding:6px 10px; font-size:13px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  #stats { color:var(--dim); font-size:12px; margin-left:auto; }
  main { display:grid; grid-template-columns: 230px 1fr 360px; gap:12px; padding:12px; }
  @media (max-width: 980px){ main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .panel h3 { margin:0 0 8px; font-size:13px; color:var(--accent); letter-spacing:.05em; }
  .snap { padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
          cursor:pointer; font-size:12px; color:var(--dim); }
  .snap:hover { border-color:var(--accent); }
  .snap.active { border-color:var(--accent); color:var(--text); background:var(--panel2); }
  .blind { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:10px; }
  .blind b { font-size:15px; }
  .blind .target { color:var(--accent); font-weight:600; }
  .cards { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .card { width:52px; height:72px; border-radius:8px; background:#f4f1e8; color:#222;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          font-size:16px; font-weight:700; position:relative; border:2px solid #d8d3c4; }
  .card .enh { position:absolute; bottom:3px; font-size:9px; font-weight:600; padding:1px 4px;
               border-radius:4px; background:#333; color:#fff; }
  .card.ed-foil { border-color:#7fd0ff; } .card.ed-holo { border-color:#c99cff; }
  .card.ed-poly { border-color:linear-gradient; border-image:linear-gradient(45deg,#ff7f7f,#7fff9e,#7fb6ff) 1; }
  .card.rec { outline:3px solid var(--good); outline-offset:1px; }
  .card.act { outline:3px dashed var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:6px;
          padding:4px 8px; font-size:12px; }
  .chip b { color:var(--accent); }
  #recBody .big { font-size:15px; font-weight:700; margin:6px 0; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin-right:6px; }
  .badge.ok { background:rgba(95,208,138,.15); color:var(--good); }
  .badge.fb { background:rgba(224,108,108,.15); color:var(--bad); }
  .muted { color:var(--dim); font-size:12px; }
  #legal { max-height:220px; overflow:auto; font-size:12px; }
  #legal div { padding:3px 6px; border-bottom:1px dashed var(--line); color:var(--dim); }
  #legal div.best { color:var(--good); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td,th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--dim); font-weight:600; }
  .match { color:var(--good); } .diff { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🃏 DecideX 小丑牌顾问</h1>
  <select id="gameSel"></select>
  <select id="provSel">
    <option value="heuristic">启发式(计分模拟)</option>
    <option value="model" disabled>真实模型(未接入)</option>
  </select>
  <button id="recBtn">推荐</button>
  <button id="runAll">跑整局</button>
  <span id="stats"></span>
</header>

<main>
  <section class="panel" id="snapPanel">
    <h3>决策点</h3>
    <div id="snapList"><div class="muted">加载中…</div></div>
  </section>

  <section class="panel">
    <h3>局面</h3>
    <div class="blind">
      <b id="blindName">-</b>
      <span>目标 <span class="target" id="blindTarget">-</span></span>
      <span>已得 <span id="blindScored">0</span></span>
      <span>剩余 <span id="blindRemain">-</span></span>
    </div>
    <div class="row" id="resRow"></div>
    <h3 style="margin-top:12px">手牌</h3>
    <div class="cards" id="hand"></div>
    <h3 style="margin-top:12px">小丑</h3>
    <div class="row" id="jokers"></div>
    <h3 style="margin-top:12px">消耗品</h3>
    <div class="row" id="consumables"></div>
  </section>

  <section>
    <div class="panel" id="recPanel">
      <h3>优秀操作推荐</h3>
      <div id="recBody"><div class="muted">点「推荐」或「跑整局」。</div></div>
      <h3 style="margin-top:12px">合法动作包络</h3>
      <div id="legal"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>顾问 vs 玩家(整局)</h3>
      <table id="cmpTable"><thead><tr><th>决策点</th><th>顾问</th><th>玩家</th></tr></thead>
        <tbody></tbody></table>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let GAMES = [], CURRENT = null, LAST = null;

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(u,b){ const r = await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function boot(){
  const h = await jget('/api/health');
  GAMES = h.games;
  $('gameSel').innerHTML = GAMES.map(g=>`<option value="${g.name}">${g.name} (${g.size_kb}K)</option>`).join('');
  $('stats').textContent = `${GAMES.length} 快照 · bridge: ${h.bridge_dir}`;
  if(GAMES.length){ await loadGame(GAMES[0].name); }
}

async function loadGame(name){
  CURRENT = name;
  const s = await jget('/api/game?name='+encodeURIComponent(name));
  render(s);
  $('recBody').innerHTML = '<div class="muted">点「推荐」。</div>';
  $('legal').innerHTML = '';
}

const ENH_CN = {bonus:'筹码',mult:'倍率',wild:'万能',glass:'玻璃',steel:'钢铁',gold:'黄金',lucky:'幸运'};
const ED_CN = {foil:'铝箔',holo:'全息',poly:'多彩'};

function render(s){
  $('blindName').textContent = s.blind.name;
  $('blindTarget').textContent = s.blind.chips;
  $('blindScored').textContent = s.blind.scored;
  $('blindRemain').textContent = Math.max(0, s.blind.chips - s.blind.scored);
  $('resRow').innerHTML =
    `<span class="chip">手牌次数 <b>${s.hands_left}</b></span>`+
    `<span class="chip">弃牌次数 <b>${s.discards_left}</b></span>`+
    `<span class="chip">金钱 <b>$${s.money}</b></span>`+
    `<span class="chip">底注 <b>${s.ante}</b> · 局 <b>${s.round}</b></span>`;
  const recIdx = new Set(LAST && LAST.candidate_id.startsWith('play:')
      ? LAST.candidate_id.slice(5).split('-').map(Number) : []);
  const actIdx = new Set(s.actual ? s.actual.cards : []);
  $('hand').innerHTML = s.hand.map((c,i)=>{
    const cls = ['card', c.edition?('ed-'+c.edition):'',
                 recIdx.has(i)?'rec':'', actIdx.has(i)?'act':''].join(' ');
    const color = (c.suit==='H'||c.suit==='D') ? '#c0392b' : '#222';
    const enh = c.enhancement ? `<span class="enh">${ENH_CN[c.enhancement]||c.enhancement}</span>` : '';
    const ed = c.edition ? `<span class="enh" style="top:3px;bottom:auto">${ED_CN[c.edition]||c.edition}</span>` : '';
    const seal = c.seal ? `<span class="enh" style="top:3px;bottom:auto;left:3px;right:auto;background:#6c5ce7">${c.seal}</span>` : '';
    return `<div class="${cls}" style="color:${color}" title="${c.rank}${c.suit}">${c.rank}${suitSym(c.suit)}${enh}${ed}${seal}</div>`;
  }).join('');
  $('jokers').innerHTML = s.jokers.length
    ? s.jokers.map(j=>`<span class="chip" title="${JSON.stringify(j.extra)}"><b>${j.name}</b>${stat(j)}</span>`).join('')
    : '<span class="muted">无</span>';
  $('consumables').innerHTML = s.consumables.length
    ? s.consumables.map(c=>`<span class="chip"><b>${c.name}</b>(${c.type})</span>`).join('')
    : '<span class="muted">无</span>';
}
function suitSym(s){ return {S:'♠',H:'♥',D:'♦',C:'♣'}[s]||s; }
function stat(j){
  const p=[]; if(j.chips) p.push('+'+j.chips+' 筹码'); if(j.mult) p.push('+'+j.mult+' 倍率');
  if(j.xmult && j.xmult!==1) p.push('×'+j.xmult);
  return p.length? ' '+p.join(' '):'';
}

async function recommend(){
  if(!CURRENT) return;
  $('recBody').innerHTML = '<div class="muted">计算中…</div>';
  try{
    const r = await jpost('/api/recommend',{name:CURRENT, kind:$('provSel').value});
    LAST = r; render(await jget('/api/game?name='+encodeURIComponent(CURRENT)));
    $('recBody').innerHTML =
      `<div class="big">${r.description}</div>`+
      `<div><span class="badge ${r.is_fallback?'fb':'ok'}">${r.is_fallback?'回落':'模型'}</span>`+
      `<span class="muted">置信度 ${(r.confidence*100).toFixed(0)}% · ${r.candidate_id}</span></div>`+
      (r.expected_score!=null? `<div class="muted">模拟得分 ${Math.round(r.expected_score)} · ${r.clears_blind?'足够过关':'未达目标'}</div>`:'')+
      (r.fallback_reason? `<div class="muted">回落原因: ${r.fallback_reason}</div>`:'');
    $('legal').innerHTML = r.legal_actions.map(a=>
      `<div class="${a.id===r.candidate_id?'best':''}">[${a.action_type}] ${a.description}</div>`).join('');
  }catch(e){ $('recBody').innerHTML = `<div class="muted">失败: ${e.message}</div>`; }
}

async function runAll(){
  $('recBody').innerHTML = '<div class="muted">整局计算中…</div>';
  try{
    const r = await jpost('/api/replay',{kind:$('provSel').value});
    const tb = $('cmpTable').querySelector('tbody');
    tb.innerHTML = r.reports.map(x=>{
      const m = x.human && x.advisor === x.human;
      return `<tr><td>${x.name}</td><td>${x.advisor}</td>`+
             `<td class="${m?'match':(x.human?'diff':'muted')}">${x.human||'(未记录)'}</td></tr>`;
    }).join('');
    const n = r.reports.length;
    $('recBody').innerHTML = `<div class="big">整局完成:${n} 个决策点</div>`+
      `<div class="muted">逐点对比见下表;单点详情回到左侧点选。</div>`;
    $('stats').textContent = `整局 ${n} 点 · ${new Date().toLocaleTimeString()}`;
  }catch(e){ $('recBody').innerHTML = `<div class="muted">失败: ${e.message}</div>`; }
}

$('gameSel').onchange = e => loadGame(e.target.value);
$('recBtn').onclick = recommend;
$('runAll').onclick = runAll;
boot();
</script>
</body>
</html>
