name: DecideX CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest -v tests

      - name: Verify repository-controlled WASM assets
        run: |
          python tools/balatro_wasm/serve.py --check


  deploy:
    # External production verification: the runner probes the public site
    # (https://balatro.mangoqwq.com) and asserts it serves exactly the
    # assets this commit ships. Zero secrets — the old SSH-based verify
    # pointed at PROD_HOST/PROD_SSH_KEY secrets that resolve to a machine
    # that is NOT the Huawei production box (Huawei sshd journals show no
    # CI logins, ever), so every SSH verify failed or verified the wrong
    # host. Deployment itself is owned by the pull-side reconciler on the
    # Huawei host (decidex-deploy-sync.timer: polls the GitHub API every
    # 15 min, pulls a main tarball over dual public endpoints / dev-VM
    # mesh relay, runs serve.py --check/--release-check, restarts).
    name: Production Verify
    needs: test
    if: github.repository == 'dengyie/decidex' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Serves This Commit's Assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://balatro.mangoqwq.com"

          # The version triple is the release contract: whatever this
          # commit's app.js/index.html advertise is what production must
          # serve. Parse it from the checked-out sources so a wrong or
          # stale deployment fails here with a concrete diff.
          LOCAL_VER=$(grep -oE 'ASSET_VERSION = "v[0-9]+"' \
            tools/balatro_wasm/web/app.js | grep -oE 'v[0-9]+')
          LOCAL_LOVE_SIZE=$(grep -oE 'EXPECTED_LOVE_SIZE = [0-9]+' \
            tools/balatro_wasm/web/app.js | grep -oE '[0-9]+')
          LOCAL_WASM_SIZE=$(grep -oE 'EXPECTED_WASM_SIZE = [0-9]+' \
            tools/balatro_wasm/web/app.js | grep -oE '[0-9]+')
          echo "local contract: $LOCAL_VER love=$LOCAL_LOVE_SIZE wasm=$LOCAL_WASM_SIZE"

          # 1. Service health (public).
          curl -fsS --max-time 30 "$BASE/api/health" | grep -q '"ok": *true' \
            || { echo "❌ /api/health not ok"; exit 1; }
          echo "✅ /api/health ok"

          # 2. /play advertises the same version.
          SERVED=$(curl -fsS --max-time 30 "$BASE/play" | grep -oE 'app.js\?v=[0-9]+' | head -1)
          EXPECTED="app.js?v=${LOCAL_VER#v}"
          echo "served: $SERVED (expected: $EXPECTED)"
          [ "$SERVED" = "$EXPECTED" ] \
            || { echo "❌ /play serves $SERVED, expected $EXPECTED"; exit 1; }
          echo "✅ /play advertises $LOCAL_VER"

          # 3. Asset sizes match this commit's expectations (HEAD, no
          #    download — reconciler lag beyond 15 min shows up here).
          LOVE_LEN=$(curl -fsSI --max-time 30 "$BASE/balatro.love.zip?$LOCAL_VER" \
            | tr -d '\r' | grep -i '^content-length:' | grep -oE '[0-9]+')
          WASM_LEN=$(curl -fsSI --max-time 30 "$BASE/love.wasm.bin?$LOCAL_VER" \
            | tr -d '\r' | grep -i '^content-length:' | grep -oE '[0-9]+')
          echo "served: love=$LOVE_LEN wasm=$WASM_LEN"
          [ "$LOVE_LEN" = "$LOCAL_LOVE_SIZE" ] \
            || { echo "❌ love.zip is $LOVE_LEN, expected $LOCAL_LOVE_SIZE"; exit 1; }
          [ "$WASM_LEN" = "$LOCAL_WASM_SIZE" ] \
            || { echo "❌ love.wasm.bin is $WASM_LEN, expected $LOCAL_WASM_SIZE"; exit 1; }
          echo "✅ asset sizes match (reconciler has caught up)"

          echo "✅ DecideX production verification completed successfully!"
