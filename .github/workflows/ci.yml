name: DecideX CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest -v tests

      - name: Verify repository-controlled WASM assets
        run: |
          python tools/balatro_wasm/serve.py --check


  deploy:
    name: Deploy to Production
    needs: test
    if: github.repository == 'dengyie/decidex' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          # The remote verification suite runs the full pytest matrix on a
          # small box; the action's 10m default kills it mid-run.
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting automated deployment for DecideX..."
            TARGET_DIR="${{ secrets.DEPLOY_PATH || '/data/decidex' }}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            if [ ! -d .git ]; then
              git init
            fi

            if ! git remote | grep -q "^origin$"; then
              git remote add origin https://github.com/dengyie/decidex.git
            else
              git remote set-url origin https://github.com/dengyie/decidex.git
            fi

            # Fetch and align with latest main. The Huawei box's HTTPS path
            # to GitHub kills *large* transfers mid-TLS-handshake (gnutls
            # "Error in the pull function" / GnuTLS recv -110): 5x30s
            # retries all failed on 2026-11-21 for hours, while short
            # probes (info/refs) and tarball endpoints (codeload.github.com,
            # /archive/main.tar.gz) returned 200 consistently. Only the
            # git smart-HTTP transport is affected. Strategy: try the
            # normal fetch first; if it still fails, fall back to a full
            # tarball re-provision (delete tracked files, extract, overlay
            # .git metadata from a fresh shallow clone over the smart
            # protocol fallback host... unavailable, so use codeload).
            fetch_ok=0
            for attempt in 1 2 3 4 5; do
              if git fetch origin main; then
                fetch_ok=1
                break
              fi
              echo "git fetch attempt $attempt failed; retrying in 30s..."
              sleep 30
            done

            if [ "$fetch_ok" -ne 1 ]; then
              echo "git fetch failed after 5 attempts; falling back to tarball re-provision"
              tarball_ok=0
              for tb in 1 2 3 4 5 6; do
                # Alternate endpoints: codeload (dedicated tarball host) and
                # github.com/archive (same CDN family as the short probes
                # that consistently return 200).
                if [ $((tb % 2)) -eq 1 ]; then
                  TB_URL="https://codeload.github.com/dengyie/decidex/tar.gz/refs/heads/main"
                else
                  TB_URL="https://github.com/dengyie/decidex/archive/refs/heads/main.tar.gz"
                fi
                echo "tarball attempt $tb: $TB_URL"
                if curl -fsSL --retry 2 --max-time 300 -o /tmp/decidex-main.tar.gz "$TB_URL"; then
                  # Guard against a truncated download passing -f: the
                  # repo tarball must be at least a few MB.
                  TB_SIZE=$(stat -c%s /tmp/decidex-main.tar.gz 2>/dev/null || echo 0)
                  if [ "$TB_SIZE" -gt 1000000 ]; then
                    tarball_ok=1
                    break
                  fi
                  echo "tarball too small ($TB_SIZE bytes); retrying"
                fi
                sleep 20
              done
              if [ "$tarball_ok" -ne 1 ]; then
                echo "tarball fallback failed after 6 attempts; aborting deploy"
                exit 1
              fi
              # Extract version tree
              rm -rf /tmp/decidex-main-src
              mkdir -p /tmp/decidex-main-src
              tar -xzf /tmp/decidex-main.tar.gz -C /tmp/decidex-main-src
              SRC_DIR=$(echo /tmp/decidex-main-src/*)
              # Replace working tree but keep .git (history for future fetches)
              find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
              cp -a "$SRC_DIR"/. .
              # Record the exact commit so reset/checkouts stay consistent
              HEAD_SHA=$(curl -fsSL --max-time 30 \
                "https://api.github.com/repos/dengyie/decidex/commits/main" \
                | grep -o '"sha": *"[0-9a-f]\{40\}"' | head -1 | grep -o '[0-9a-f]\{40\}')
              if [ -n "$HEAD_SHA" ]; then
                git update-ref refs/remotes/origin/main "$HEAD_SHA" 2>/dev/null || true
                git reset --hard origin/main 2>/dev/null || true
              fi
              echo "tarball re-provision complete"
            fi

            git reset --hard origin/main 2>/dev/null || true
            git branch -M main

            # Install/update package in existing virtual environment
            if [ ! -x .venv/bin/pip ]; then
              python3 -m venv .venv
            fi
            .venv/bin/pip install -e ".[dev]"

            # Require externally provisioned proprietary assets and verify their manifest.
            python3 tools/balatro_wasm/serve.py --check
            python3 tools/balatro_wasm/serve.py --release-check

            # Run production verification tests; absence is a hard deployment failure.
            echo "🧪 Running remote verification test suite..."
            .venv/bin/pytest tests
            echo "✅ DecideX production deployment completed successfully!"
