name: DecideX CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest -v tests

      - name: Verify repository-controlled WASM assets
        run: |
          python tools/balatro_wasm/serve.py --check


  deploy:
    # Post-deploy verification against the live production box. Production
    # itself is deployed by the pull-side reconciler on the Huawei host
    # (decidex-deploy-sync.timer: polls the GitHub API every 15 min, pulls
    # a main tarball over dual public endpoints / dev-VM mesh relay, runs
    # serve.py --check/--release-check, restarts the service). This job
    # used to fetch+reset a checkout here over Huawei->GitHub HTTPS, but
    # that path kills large TLS streams for hours at a time (gnutls -110
    # / SSL unexpected eof), which kept the job red while production was
    # already correct. Verification now runs against the reconciler's
    # checkout instead of re-provisioning one.
    name: Production Verify
    needs: test
    if: github.repository == 'dengyie/decidex' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Run Verification Suite on Production Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          # The remote verification suite runs the full pytest matrix on a
          # small box; the action's 10m default kills it mid-run.
          command_timeout: 30m
          script: |
            set -e
            echo "🔍 Verifying production deployment state..."
            PROD_DIR=/opt/decidex-hs
            cd "$PROD_DIR"

            # 1. Service health
            systemctl is-active --quiet decidex-balatro-web || { echo "❌ service inactive"; exit 1; }
            curl -fsS -o /dev/null http://127.0.0.1:8091/play || { echo "❌ /play not serving"; exit 1; }
            echo "✅ service active, /play 200"

            # 2. Deployed commit matches origin/main (reconciler lag up to
            #    15 min is fine; a mismatch older than that is not).
            MARKER_SHA=$(cat "$PROD_DIR/.deploy-sync/deployed.sha" 2>/dev/null || echo none)
            ORIGIN_SHA=$(curl -fsSL --max-time 30 \
              "https://api.github.com/repos/dengyie/decidex/commits/main" \
              | grep -o '"sha": *"[0-9a-f]\{40\}"' | head -1 | grep -o '[0-9a-f]\{40\}')
            echo "marker=$MARKER_SHA origin=$ORIGIN_SHA"
            if [ "$MARKER_SHA" != "$ORIGIN_SHA" ]; then
              # Trigger the reconciler once and give it a window to catch up.
              systemctl start decidex-deploy-sync.service || true
              for i in 1 2 3 4 5 6; do
                sleep 30
                MARKER_SHA=$(cat "$PROD_DIR/.deploy-sync/deployed.sha" 2>/dev/null || echo none)
                [ "$MARKER_SHA" = "$ORIGIN_SHA" ] && break
              done
            fi
            if [ "$MARKER_SHA" != "$ORIGIN_SHA" ]; then
              echo "❌ production marker still behind origin/main after reconciler nudge"
              exit 1
            fi
            echo "✅ production aligned with origin/main ($MARKER_SHA)"

            # 3. Asset manifest checks on the deployed tree.
            .venv/bin/python tools/balatro_wasm/serve.py --check
            .venv/bin/python tools/balatro_wasm/serve.py --release-check

            # 4. Full test matrix against the deployed checkout.
            echo "🧪 Running remote verification test suite..."
            .venv/bin/pytest tests
            echo "✅ DecideX production verification completed successfully!"
